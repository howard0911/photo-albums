  paper: "#FAFAF8 neutral vs #FFFBF7 warm ✔ (close, both light)"
  accent hue: "330° magenta vs 14° orange ✔"
  display: "Big Shoulders condensed vs Archivo wide ✔"
  motion: "bounce vs 利落 ✔"
  dots: "star vs circle ✔"
  styles: "neon / sunset vs ink / halftone ✔"
  scale: "Mixolydian vs miyako-bushi ✔"
  instruments: "surf guitar / glockenspiel / vibraphone / muted trumpet vs synth / FM bell / keys ✔"
