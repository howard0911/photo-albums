# Style DNA — Los Angeles, July 2025  (final, confirmed with Howard)
# Every decision names its source: a photo (.dna/contact.jpg number / file), a number from .dna/dna-seed.json, or Howard's answer.

trip: "Six days of LA summer: the pier and the boardwalk, a day of make-believe in the parks, the white hilltop of the Getty, the city's famous signs, a wall that pink, and sunsets from the beach and the observatory"   # Q1: draft accepted
place: Downtown · Santa Monica · Venice · Anaheim · Brentwood · Hollywood · Griffith Park · Beverly Hills · Melrose, Los Angeles, USA
language: English only            # Q2. The template's CJK slot carries each chapter's mood in lowercase Big Shoulders
evidence:   # analyze_photos.py on the 36 picks (from 978 Canon R50 frames, Jul 21–26 2025; close-up faces, selfies and repeats left out)
  tone: mid / contrast: normal / chroma: moderate / temperature: neutral
  hue_spread: varied (concentration .152), dominant_hue: 314° / night_share: .11 / portrait_share: .19
  accent_candidates: hollywood-sky #1772DD (212°, img-0825), call-me-red #C40521 (351°, img-1042), cozy-cone-neon #DB5022 (15°, img-0534), sunset #FBD768 (45°, img-0955), voodoo-palm #1D9472 (163°, img-0746)
  pink count: Paul Smith wall img-1089 #FDAFD8 (88% of the frame), img-1066 #F7A1BE (46%), Pink's building img-0755 #B06E85 (33%), Voodoo img-0746 #C498A9, Call me img-1042 #BB5A7B
  motifs (contact.jpg): signs everywhere (01, 03, 11, 16, 23–25, 27, 28, 32, 33); Ferris wheels (02, 07, 13); stars (26); palms against the sky (05, 10); pink (23, 25, 34–36); two sunsets (08–10, 29, 30)

color:      # Q3: direction A "Melrose"
  paper: "#FAFAF8"   # temperature neutral → paper_light #FAFAF8 unchanged; the white travertine of the Getty (18, img-0576)
  ink: "#141418"     # paper_ink #121212, nudged toward the night sky over the city lights (31, img-0977)
  accent: "#D4307F"  # Paul Smith wall img-1089 #FDAFD8 (328°) deepened to stand on paper → 330° (+2°); 4.4:1 on paper.
                     # Recurs in Pink (23, 25, 34–36) and the Getty bougainvillea (21).
                     # Sky blue rejected (Paris 222°); Cozy Cone orange rejected (JAPAN 14°); Call me red rejected (SoCal 355°).
                     # Tokyo is 349° rose #D63C58 — 19° away; this is magenta
  on_accent: "#FAFAF8"   # paper on pink 4.4:1
  rejected_B: "#12866A Voodoo palm green (img-0746) — unique across the albums, but a small colour in every photo"
type:
  display: Big Shoulders Display 900, stretch: normal (--stretch 100%), case: upper (--case uppercase, upper:true), thicken .02
  second voice: Big Shoulders Display 400 lowercase (--cjk); 400 not 300, the condensed light strokes were too thin for captions
  why: tall narrow caps like the letters of the HOLLYWOOD sign (28, img-0825), and the marquee lettering on the Chinese Theatre (27)
hero: { word: LOS ANGELES, sub: "Summer / 25 / 07", line: "Santa Monica · Venice · Anaheim · Getty · Hollywood · Griffith · Beverly Hills · Melrose" }   # Q1
  # one line on wide screens, two on narrow ones: sampleDots picks whichever layout gives the larger letters (a condensed face on two lines is capped by height)
motion:
  character: bounce (弹跳) — pier rides, theme-park floats, synth pop; contrast normal, a busy summer trip
  drift: .004  follow: .09  spring: .08  damp: .72  repel: 70  gather: 850  develop: 1100
  ease: cubic-bezier(.3,1.25,.5,1)   # a little overshoot
texture:
  dots: star         # five-pointed, the Walk of Fame (26, img-0770); upright at rest, tipped by speed
  styles: [orig, neon, sunset, block]
    # neon: Sobel edges as glowing ACCENT tubes over a barely lit INK street, the Cozy Cone Motel sign after dark (16, img-0534)
    # sunset: gradient map through the Santa Monica sunset img-0273 — ink → #544A4E → #B47250 → #EEA861 → #F6ECCC, with grain
    # block: k-means palette kept, the proof that the photos are the material
sound:
  scale: "[0,2,4,5,7,9,10] D Mixolydian"   # the flat 7th of surf rock and California pop; no sibling album uses it
  base: 62
  presence: 1.3        # Q4: a little forward, the busiest trip of the albums
  ring melody: an original surf-pop hook (no borrowed tune)
  new instruments: V.twang (surf guitar), V.gull, V.glock, V.snare, V.vibes, V.trumpet (Harmon mute), V.horn, V.clap, V.hat, V.cricket
  engine fix: every gain that env() or a noise instrument automates now starts at 0. Before, a source starting a sample ahead of its
    first automation event played one sample at full gain: the Make-Believe snare roll spiked to .7. Applied to socal-2025 too
  measured peaks: >
    Offline render (the gstack headless browser crashes on Windows once live audio runs): the same bus graph in an OfflineAudioContext,
    ambience at full presence, viewer opened at 2 s with the duck, peak over the next 3 s, median of 3.
    Boardwalk .092 · Make-Believe .121 · Travertine .072 · Signs .124 · Pink .141 · Sundown .118 (spread 2×).
    The same render gives Lake Geneva .066–.13 against its live .113–.225, so live LA should land ≈ .12–.25, inside .10–.32.
chapters:   # Q2: accepted as proposed; numbers refer to .dna/contact.jpg
  - { en: Boardwalk,    mood: carefree,   photos: [03, 02, 04, 05, 06, 07], ambient: "surf + pier crowd + tremolo-picked surf-guitar riffs + skateboards + gulls", voice: twang }
  - { en: Make-Believe, mood: giddy,      photos: [11, 12, 14, 13, 15, 16], ambient: "park crowd + 2/4 parade march: snare, glockenspiel tune, bass",          voice: glockenspiel }
  - { en: Travertine,   mood: cool calm,  photos: [17, 18, 19, 20, 21, 22], ambient: "water channel + fountain + high hill air + slow vibraphone chords",        voice: vibes }
  - { en: Signs,        mood: starstruck, photos: [01, 26, 27, 28, 32, 33], ambient: "boulevard traffic + car horns + muted trumpet over a walking bass",       voice: muted trumpet }
  - { en: Pink,         mood: bubblegum,  photos: [35, 36, 23, 24, 25, 34], ambient: "116 BPM synth pop: eighth-note bass, claps, stabs, hats; D · C · G · D",    voice: soft synth }
  - { en: Sundown,      mood: wistful,    photos: [08, 09, 10, 29, 30, 31], ambient: "crickets + the city's low hum + slow electric-piano chords",               voice: keys }
swaps: []

