<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAKE GENEVA — Howard's travel album</title>   <!-- keep in sync with THEME.title -->
<meta name="author" content="Howard">
<!-- Fonts: one slab family doing both jobs (900 caps for display, 300 lowercase for the second voice). Change together with :root --display and THEME.font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300..900&display=swap" rel="stylesheet">
<style>
/* ===== 风格区（CSS）：every value comes from the photos — see style-dna.yaml ===== */
:root{
  --bg:#F3F6F9;              /* paper: leaning cool — temperature measured "cool" (paper_light #F6F9FC), the pale lake haze of img-1229 */
  --ink:#0F1820;             /* ink: lake-deep near-black, from the water of img-1253 (#0F2327) */
  --muted:rgba(15,24,32,.55);
  --line:rgba(15,24,32,.1);
  --accent:#C27C0C;          /* cheddar gold: the cheese of img-1296 (#DA931F, 37°) deepened to 3.1:1 on paper — the complement of the 215° sky */
  --on-accent:#0F1820;       /* ink on gold (5.3:1), black on yellow like the cheese castle sign */
  --hdr:56px;
  --ease:cubic-bezier(.45,0,.2,1);  /* soft: a lake swell, slow to start and slow to settle */
  --cjk:"Roboto Slab",serif;                                /* second voice: the same slab, light and lowercase (see below) */
  --display:"Roboto Slab",serif;                            /* slab caps: Midwest storefront lettering — Jayne's, Kilwins, Popeye's on the lake */
  --stretch:100%;            /* Roboto Slab has no width axis */
  --case:uppercase;          /* labels and titles in caps; THEME.font.upper must match */
  --ph:#DFE5EC;              /* placeholder before a photo loads: shaded lake haze */
}
/* second voice: where the template put a CJK line, this album sets the slab light and lowercase */
body :is(.ov b span,.ch-title span,.lb-top .ch span,.styles button span,.fig .tag span,.lb-mode span,.tile.text .jp,.lb-read.empty b){font-weight:300;text-transform:none;letter-spacing:.01em}
body :is(.ch-line,.fig .cap,.lb-cap,.author-intro){font-weight:300}   /* body + :is() outranks the engine rules below that set 500/700 */
@media (max-width:700px){ .ch-title span{display:block;margin:3px 0 0;font-size:.62em} }   /* English moods are longer than two CJK glyphs: stack them on phones */
/* ===== 以下是引擎，换风格时一般不用动 ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:var(--display);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.x{font-stretch:var(--stretch);text-transform:var(--case);letter-spacing:.02em}

/* ---------- header ---------- */
.hdr{position:fixed;inset:0 0 auto 0;height:var(--hdr);display:flex;align-items:stretch;
  border-bottom:1px solid var(--line);background:var(--bg);z-index:20}
.logo{display:flex;align-items:center;gap:6px;padding:0 24px;font-weight:800;font-size:19px;letter-spacing:.01em}
.logo .box{display:inline-grid;place-items:center;height:20px;padding:0 4px;border:2.5px solid var(--accent);
  color:var(--accent);font-size:12px;font-weight:800;line-height:1}
.nav{margin-left:auto;display:flex}
.nav a{display:flex;align-items:center;padding:0 28px;border-left:1px solid var(--line);font-size:12px;font-weight:500;
  transition:color .25s}
.nav a:hover,.nav a[aria-current="true"]{color:var(--accent)}
.about-trigger{padding:0 28px;border-left:1px solid var(--line);font-size:12px;font-weight:500;transition:color .25s}
.about-trigger:hover,.about-trigger[aria-expanded="true"]{color:var(--accent)}
.snd{display:flex;align-items:center;gap:10px;padding:0 24px;border-left:1px solid var(--line);font-size:12px;font-weight:500;transition:color .25s}
.snd:hover,.snd[aria-pressed="true"]{color:var(--accent)}
.snd .eq{display:flex;align-items:flex-end;gap:2px;height:12px}
.snd .eq i{width:2px;height:3px;background:currentColor}
.snd[data-playing="true"] .eq i{animation:eq .9s ease-in-out infinite}
.snd .eq i:nth-child(2){animation-delay:-.3s}.snd .eq i:nth-child(3){animation-delay:-.6s}.snd .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* ---------- views ---------- */
.view{position:fixed;inset:var(--hdr) 0 0 0}
.view[hidden]{display:none}

/* ---------- home: photo ring ---------- */
.frame{position:absolute;--c:120px}
.strip{position:absolute;overflow:hidden}
.tile{position:absolute;left:0;top:0;width:var(--c);height:var(--c);overflow:hidden;will-change:transform;
  display:block;background:var(--ph)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.001);
  transition:transform .8s var(--ease)}
.ov{position:absolute;inset:0;background:var(--accent);color:var(--on-accent);
  display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--c)*.09);
  clip-path:inset(100% 0 0 0);transition:clip-path .5s var(--ease);text-align:left;pointer-events:none}
.tile:focus-visible .ov{clip-path:inset(0 0 0 0)}
@media (hover:hover){
  .tile:hover img{transform:scale(1.06)}
  .tile:hover .ov{clip-path:inset(0 0 0 0)}
}
.tile.preview{outline:3px solid var(--accent);outline-offset:-3px}
.tile.preview .ov{clip-path:inset(0);background:linear-gradient(transparent 40%,rgba(18,18,18,.75));color:var(--bg)}
#home{touch-action:none}
.ov em{font-style:normal;font-size:clamp(8px,calc(var(--c)*.072),11px);font-weight:600}
.ov b{font-size:clamp(9px,calc(var(--c)*.085),13px);font-weight:700;line-height:1.25}
.ov b span{display:block;font-family:var(--cjk);font-stretch:100%;font-weight:500;margin-top:2px}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.tile.text{display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--c)*.09);cursor:default}
.tile.text.a{background:var(--accent);color:var(--on-accent)}
.tile.text.b{background:var(--ink);color:var(--accent)}
.tile.text p{font-size:calc(var(--c)*.118);font-weight:700;line-height:1.08}
.tile.text small{font-size:clamp(7px,calc(var(--c)*.065),11px);font-weight:500;opacity:.8}
.tile.text .jp{font-family:var(--cjk);font-stretch:100%;font-size:calc(var(--c)*.15);font-weight:700;letter-spacing:.04em}

.center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  pointer-events:none}
.center canvas{display:block;pointer-events:auto;touch-action:none}
.sub{font-size:clamp(11px,1.25vw,17px);font-weight:500;letter-spacing:.06em}
.home-byline{display:block;margin:7px auto 0;padding:2px 0;font-size:10px;color:var(--muted);
  text-transform:none;letter-spacing:.04em;pointer-events:auto;transition:color .25s}
.home-byline:hover{color:var(--accent)}
.places{font-size:clamp(9px,.8vw,11px);color:var(--muted);letter-spacing:.14em}
.hint{font-size:10px;color:var(--muted);letter-spacing:.2em;
  display:flex;align-items:center;gap:8px}
.hint i{width:28px;height:1px;background:currentColor;position:relative;overflow:hidden}
.hint i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:translateX(-100%);
  animation:sweep 2.4s var(--ease) infinite}
.touch-enter{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px;border:1px solid var(--accent);
  color:var(--accent);font-family:var(--cjk);font-size:12px;pointer-events:auto}
.touch-enter[hidden]{display:none}
.touch-enter:hover{background:var(--accent);color:var(--on-accent)}
.touch-enter:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
@keyframes sweep{60%,100%{transform:translateX(100%)}}

/* ---------- chapter view ---------- */
.ch-head{position:absolute;inset:0 0 auto 0;height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px}
.ch-head .back{justify-self:start;font-size:12px;color:var(--muted);transition:color .25s}
.ch-head .back:hover{color:var(--accent)}
.ch-title{text-align:center;font-size:clamp(20px,2.2vw,30px);font-weight:500;line-height:1.1}
.ch-title small{display:block;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.18em;margin-bottom:6px}
.ch-title span{font-family:var(--cjk);font-stretch:100%;font-weight:500;margin-left:.4em}
.ch-count{justify-self:end;font-size:12px;color:var(--muted)}
.ch-line{position:absolute;top:84px;left:0;right:0;text-align:center;font-family:var(--cjk);font-size:13px;color:var(--muted)}
.ch-viewport{position:absolute;inset:124px 0 132px 0;overflow:hidden;cursor:grab;touch-action:pan-y}
.ch-viewport.drag{cursor:grabbing}
.ch-track{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;gap:clamp(24px,5vw,80px);
  padding:0 12vw;will-change:transform}
.fig{flex:none;display:flex;flex-direction:column;gap:14px}
.fig .pic{flex:none;position:relative;overflow:hidden;background:var(--ph)}
.fig img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08);will-change:transform;user-select:none;-webkit-user-drag:none}
.fig figcaption{display:flex;align-items:baseline;gap:14px;font-size:13px}
.fig .no{font-size:11px;color:var(--accent);font-weight:600;flex:none}
.fig .cap{font-family:var(--cjk);color:var(--ink)}
/* style layer: a canvas over the photo; on switch an accent block wipes up from below */
.fig .fx{position:absolute;inset:0;width:100%;height:100%;opacity:0;will-change:transform;pointer-events:none}
.fig.styled .fx{opacity:1}
.fig .wipe{position:absolute;inset:0;background:var(--accent);transform:translateY(101%);pointer-events:none;z-index:3}
.fig .tag{position:absolute;left:10px;top:10px;z-index:2;background:var(--bg);font-size:10px;font-weight:600;padding:5px 8px;
  letter-spacing:.08em;opacity:0;transition:opacity .4s}
.fig .tag span{font-family:var(--cjk);font-stretch:100%;margin-left:6px}
#chapter:not([data-style="orig"]) .fig.keep .tag{opacity:1}
.fig .pal{position:absolute;left:0;right:0;bottom:0;display:flex;z-index:2;transform:translateY(101%);transition:transform .6s var(--ease) .15s}
#chapter[data-style="block"] .fig.styled .pal{transform:none}
.fig .pal i{height:30px;min-width:0;background:var(--sw)}
.ch-prog{position:absolute;left:24px;right:24px;bottom:118px;height:1px;background:var(--line)}
.ch-prog b{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.ch-foot{position:absolute;left:0;right:0;bottom:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;font-size:12px}
.ch-foot a{color:var(--muted);transition:color .25s}
.ch-foot a:hover{color:var(--accent)}
.ch-foot .next{justify-self:end}
.styles{display:flex;border:1px solid var(--line);background:var(--bg)}
.styles button{display:flex;align-items:baseline;gap:7px;padding:9px 16px;font-size:10px;font-weight:600;letter-spacing:.08em;
  transition:background .3s,color .3s}
.styles button+button{border-left:1px solid var(--line)}
.styles button span{font-family:var(--cjk);font-stretch:100%;font-size:12px;font-weight:500;letter-spacing:.04em}
.styles button em{font-style:normal;opacity:.7}
.styles button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.styles button:not([aria-pressed="true"]):hover{color:var(--accent)}
.foot{position:absolute;left:0;right:0;bottom:0;height:44px;border-top:1px solid var(--line);display:grid;
  grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;font-size:10px;color:var(--muted);letter-spacing:.12em}
.foot span:last-child{justify-self:end}
.author-signature{justify-self:start;font-size:inherit;color:inherit;text-transform:none;letter-spacing:.03em}
.author-signature:hover{color:var(--accent)}

/* ---------- 作者页：与章节共用路由和幕布转场 ---------- */
.about{display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.about .ch-head{position:relative;inset:auto;flex:none}
.author-page{width:min(1100px,100%);margin:0 auto;flex:1;display:grid;grid-template-columns:1.2fr 1fr;
  align-items:center;gap:clamp(40px,7vw,110px);padding:48px}
.author-kicker{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:16px}
.author-name{font-size:clamp(80px,10vw,144px);font-weight:800;font-stretch:var(--stretch);line-height:1.1;letter-spacing:-.05em}
.author-name:focus{outline:none}
.author-intro{margin-top:24px;font-family:var(--cjk);font-size:14px;line-height:1.9;color:var(--muted)}
.author-socials{display:flex;gap:12px;padding-bottom:32px}
.author-socials[hidden]{display:none}
.social-icon{position:relative;display:grid;place-items:center;width:58px;height:58px;flex:none;
  border:1px solid var(--line);transition:color .2s,border-color .2s,background .2s}
.social-icon svg{display:block;width:25px;height:25px;fill:currentColor}
.social-icon[data-platform="xiaohongshu"] svg{width:34px;height:34px}
.social-icon:hover,.social-icon:focus-visible{color:var(--accent);border-color:var(--accent);background:rgba(194,124,12,.05)}
.social-tooltip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
  padding:5px 8px;background:var(--ink);color:var(--bg);font-family:var(--cjk);font-size:10px;line-height:1.4;
  white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none}
.social-icon:hover .social-tooltip,.social-icon:focus-visible .social-tooltip{opacity:1;visibility:visible}
.author-contact{margin-top:16px;padding-top:24px;border-top:1px solid var(--line)}
.author-label{font-family:var(--cjk);font-size:11px;font-weight:500;color:var(--muted);margin-bottom:14px}
.author-email-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.author-email{display:flex;align-items:center;gap:10px;min-width:0;font-size:14px;letter-spacing:.01em}
.author-email span{overflow-wrap:anywhere}
.author-email:hover{color:var(--accent)}
.author-email svg,.author-copy svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.author-copy{display:grid;place-items:center;width:40px;height:40px;flex:none;border:1px solid var(--line)}
.author-copy:hover{color:var(--accent);border-color:var(--accent)}
.author-status{min-height:30px;margin-top:8px;color:var(--accent);font-family:var(--cjk);font-size:11px;line-height:1.6}
.about .foot{position:static;flex:none;min-height:44px}
.about .foot span:first-child{text-transform:none}
.about-trigger:focus-visible,.home-byline:focus-visible,.author-signature:focus-visible,
.author-page :is(a,button):focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* ---------- 单张大图：点阵显影 + 放大镜 ---------- */
.fig .pic{cursor:zoom-in}
.fig .pic:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.lb{position:fixed;inset:0;z-index:40;pointer-events:none;--side:300px}
.lb.open{pointer-events:auto}
.lb-veil{position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .5s var(--ease)}
.lb.open .lb-veil{opacity:1}
.lb-dev{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lb-stage{position:absolute;top:0;left:0;bottom:0;right:var(--side);touch-action:none}
.lb-side{position:absolute;top:0;right:0;bottom:0;width:var(--side);background:var(--bg);border-left:1px solid var(--line);
  padding:22px 24px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;transform:translateX(100%);visibility:hidden;
  transition:transform .6s var(--ease),visibility 0s .6s}
.lb.open .lb-side{transform:none;visibility:visible;transition:transform .6s var(--ease) .15s,visibility 0s}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px}
.lb-top .ch{color:var(--accent);font-weight:600;letter-spacing:.14em}
.lb-top .ch span{font-family:var(--cjk);font-stretch:100%;margin-left:6px;letter-spacing:.04em}
.lb-top button{flex:none;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.1em;padding:6px 0;transition:color .25s}
.lb-top button:hover{color:var(--accent)}
.lb-no{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.01em}
.lb-no span{color:var(--muted);font-weight:500}
.lb-cap{font-family:var(--cjk);font-size:17px;line-height:1.6;margin-top:-6px}
.lb-mode{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--accent);margin-top:-10px}
.lb-mode span{font-family:var(--cjk);font-stretch:100%;color:var(--muted);font-weight:500;letter-spacing:.02em;margin-left:8px}
.lb-lbl{display:flex;justify-content:space-between;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.lb-read{height:64px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--ph);
  transition:background-color .12s,color .12s}
.lb-read b{font-size:20px;font-weight:700;font-stretch:var(--stretch);letter-spacing:.04em}
.lb-read i{font-style:normal;font-size:10px;opacity:.7;letter-spacing:.06em;white-space:nowrap}
.lb-read.empty b{font-family:var(--cjk);font-stretch:100%;font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted)}
.lb-pal{display:flex;flex-direction:column;gap:6px}
.lb-pal button{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;font-size:12px;text-align:left;padding:2px 0}
.lb-pal i{height:20px;box-shadow:inset 0 0 0 1px var(--line)}
.lb-pal b{font-weight:600;font-stretch:var(--stretch);letter-spacing:.05em;transition:color .2s}
.lb-pal span{color:var(--muted);font-size:11px}
.lb-pal button:hover b{color:var(--accent)}
.lb-cred{font-size:11px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.lb-cred em{display:block;font-style:normal;color:var(--accent);font-weight:600;letter-spacing:.12em;font-size:10px;margin-bottom:2px}
.lb-navs{display:flex;gap:8px}
.lb-navs button{flex:1;border:1px solid var(--line);padding:10px 0;font-size:11px;font-weight:600;letter-spacing:.1em;
  transition:background .2s,color .2s,border-color .2s}
.lb-navs button:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lb-keys{margin-top:auto;font-family:var(--cjk);font-size:11px;color:var(--muted);line-height:1.9}
.lb-keys kbd{font:600 10px var(--display);color:var(--ink);border:1px solid var(--line);padding:0 5px;margin-right:6px}
/* 放大镜：四个裁切角标 + 留空的十字准星，下面挂一条色号标签 */
.loupe{position:fixed;left:0;top:0;width:var(--L,210px);height:var(--L,210px);z-index:41;pointer-events:none;opacity:0;transition:opacity .2s}
.loupe.on{opacity:1}
.lp-in{position:absolute;inset:0;transform:scale(.82);transition:transform .3s var(--ease)}
.loupe.on .lp-in{transform:none}
.lp-in canvas{width:100%;height:100%;display:block;box-shadow:0 14px 34px rgba(18,18,18,.22)}
.lp-k{position:absolute;width:18px;height:18px;border:0 solid var(--accent)}
.lp-k.tl{left:-7px;top:-7px;border-width:2px 0 0 2px}
.lp-k.tr{right:-7px;top:-7px;border-width:2px 2px 0 0}
.lp-k.bl{left:-7px;bottom:-7px;border-width:0 0 2px 2px}
.lp-k.br{right:-7px;bottom:-7px;border-width:0 2px 2px 0}
.lp-x{position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 1px rgba(243,246,249,.9))}
.lp-x::before,.lp-x::after{content:"";position:absolute}
.lp-x::before{left:0;right:0;top:11px;height:2px;background:linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 16px,var(--accent) 16px)}
.lp-x::after{top:0;bottom:0;left:11px;width:2px;background:linear-gradient(180deg,var(--accent) 0 8px,transparent 8px 16px,var(--accent) 16px)}
.lp-t{position:absolute;left:-7px;top:calc(100% + 12px);display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);
  font-size:10px;font-weight:700;letter-spacing:.08em;padding:5px 8px 5px 6px;white-space:nowrap}
.lp-t i{width:12px;height:12px;box-shadow:0 0 0 1px rgba(243,246,249,.3)}
.lp-t em{font-style:normal;color:var(--accent)}
@media (max-width:700px){
  .lb{--side:0px}
  .lb-stage{right:0;bottom:42%}
  .lb-side{top:auto;left:0;width:auto;height:42%;border-left:0;border-top:1px solid var(--line);padding:16px;gap:14px;transform:translateY(100%)}
  .lb-no{font-size:30px}
  .lb-cap{font-size:15px}
  .lb-keys{display:none}
}
@media (prefers-reduced-motion:reduce){ .lb-veil,.lb-side,.lp-in{transition:none} }

/* ---------- curtain ---------- */
.curtain{position:fixed;inset:0;background:var(--accent);z-index:50;transform:translateY(100%);pointer-events:none;
  display:grid;place-items:center;color:var(--on-accent)}
.curtain.active{pointer-events:auto}
.curtain b{font-size:clamp(28px,6vw,80px);font-weight:800;font-stretch:var(--stretch);letter-spacing:.02em;text-transform:var(--case)}

@media (max-width:700px){
  :root{--hdr:50px}
  .logo{padding:0 10px;font-size:14px}
  .nav a{padding:0 8px;font-size:10px}
  .nav [data-nav="home"]{display:none}
  .nav a.opt{display:none}
  .snd{padding:0 10px}
  .snd .lbl{display:none}
  .about-trigger{padding:0 10px;font-size:10px}
  .author-page{grid-template-columns:1fr;align-content:center;gap:28px;padding:28px 24px 32px}
  .author-name{font-size:76px}
  .author-intro{margin-top:18px;font-size:13px}
  .author-socials{gap:12px}
  .author-contact{margin-top:8px;padding-top:20px}
  .about .ch-head{height:76px}
  .about .ch-count{font-size:9px}
  .places{display:none}
  .sub,.hint{white-space:nowrap}
  .hint{font-size:10px;letter-spacing:.06em;gap:6px}
  .hint i{width:14px}
  .ch-head{padding:0 16px;height:76px}
  .ch-line{top:76px;font-size:12px;padding:0 16px}
  .ch-viewport{inset:112px 0 124px 0}
  .ch-track{padding:0 16px;gap:20px}
  .ch-foot{padding:0 16px;bottom:56px;font-size:10px}
  .ch-foot .lbl{display:none}
  .ch-prog{left:16px;right:16px;bottom:110px}
  .styles button{padding:8px 9px}
  .styles button em{display:none}
  .foot{padding:0 16px;font-size:9px}
  .foot span:nth-child(2){display:none}
}
@media (max-width:360px){
  .logo{padding:0 8px}
  .about-trigger{padding:0 8px}
}
@media (prefers-reduced-motion:reduce){
  .tile img,.ov{transition:none}
  .hint i::after{animation:none}
}

// 环上的格子：各章节轮流取一张，让相邻格子尽量来自不同章节
function ringTiles(){
  const out = [], max = Math.max(...CHAPTERS.map(c=>c.photos.length));
  for (let k=0;k<max;k++) CHAPTERS.forEach((c,ci)=>{ if (c.photos[k]) out.push({ ci, pi:k, p:c.photos[k] }); });
  for (let i=0, n=out.length; out.length < 24; i++) out.push(out[i % n]);   // 照片环四条边至少要二十几格，照片少时循环补满
  out.splice(3,0,{ text:TEXT_TILES[0] });
  out.splice(17,0,{ text:TEXT_TILES[1] });
  return out;
}
const TILES = ringTiles();

/* ---------------- 首页：照片环 ---------------- */
const frame = $("#frame"), center = $("#center");
const ring = { u:0, tu:0, strips:[], c:120, cols:7, rows:5, lastInput:0, hover:false,
  input:matchMedia("(hover: none), (pointer: coarse)").matches ? "touch" : "mouse", preview:null, suppressUntil:0 };
const touchEnter = $("#touchEnter"), touchGuide = $("#touchGuide");
function updateTouchGuide(){
  touchGuide.textContent = ring.input==="mouse" ? "Scroll to travel" : ring.preview ? "Tap again, or enter the chapter" : "Tap to preview · swipe to travel";
}
function clearTouchPreview(reset=true){
  ring.preview = null;
  frame.querySelectorAll(".tile.preview").forEach(el=>el.classList.remove("preview"));
  touchEnter.hidden = true;
  updateTouchGuide();
  if (reset && P.shapes.length){ clearTimeout(P.timer); setShape(0, null, false); setCaption(-1); }
}
function previewTile(t){
  clearTimeout(P.timer);
  if (!P.shapes.length) sampleDots(false);
  P.mx = P.my = -1e4;
  ring.preview = { ...t, at:performance.now() }; ring.tu = ring.u;
  frame.querySelectorAll("a.tile").forEach(el=>el.classList.toggle("preview", el.dataset.src===t.p.src));
  setCaption(t.ci); setShape(t.ci+1, t.p.src);
  touchEnter.href = `#/ch/${t.ci+1}/${t.pi+1}`;
  touchEnter.textContent = `Enter ${CHAPTERS[t.ci].en} →`; touchEnter.hidden = false;
  updateTouchGuide(); sndHover(t.ci, t.pi);
}

function tileEl(t){
  if (t.text){
    const d = document.createElement("div");
    d.className = "tile text x " + t.text.cls; d.innerHTML = t.text.html; return d;
  }
  const ch = CHAPTERS[t.ci], b = document.createElement("a");
  b.className = "tile"; b.href = `#/ch/${t.ci+1}/${t.pi+1}`;
  b.dataset.src = t.p.src;
  if (ring.preview?.p.src===t.p.src) b.classList.add("preview");
  b.setAttribute("aria-label", `${ch.en}: ${t.p.cap}`);
  const label = `<em>CH.${pad2(t.ci+1)} — ${pad2(t.pi+1)}</em><b>${ch.en}<span>${ch.zh}</span></b>`;
  b.innerHTML = `<img src="photos/sq/${t.p.src}.jpg" alt="" decoding="async"><span class="ov x">${label}</span>`;
  b.addEventListener("pointerenter", e=>{
    if (e.pointerType!=="mouse") return;
    if (ring.preview) clearTouchPreview(false);
    ring.input = "mouse"; updateTouchGuide();
    ring.hover = true; hoverChapter(t.ci, t.p.src); sndHover(t.ci, t.pi);
  });
  b.addEventListener("pointerleave", e=>{
    if (e.pointerType!=="mouse") return;
    ring.hover = false; if (route.view==="home") hoverChapter(-1);
  });
  b.addEventListener("click", e=>{
    if (performance.now() < ring.suppressUntil){ e.preventDefault(); return; }
    if (e.detail===0 && !e.pointerType) return; // 键盘和辅助功能保持一次激活即可进入。
    const touch = e.pointerType ? e.pointerType!=="mouse" : ring.input!=="mouse";
    if (!touch) return;
    ring.input = "touch"; ring.hover = false;
    // 第一次轻点留在首页预览；再点同一张，或点中间的进入按钮。
    if (ring.preview?.p.src===t.p.src) return;
    e.preventDefault(); previewTile(t);
  });
  b.querySelector("img").addEventListener("load", ()=>{
    if (ring.preview?.p.src===t.p.src && P.shapes.length) setShape(t.ci+1, t.p.src, false);
  });
  return b;
}

function layoutRing(){
  const W = innerWidth, H = innerHeight - parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hdr"));
  const landscape = W > 700 && W/H > .95;
  // 横屏固定 4 行，列数按屏幕比例取（16:9 约 7 列，更宽的屏 8–9 列），让照片环尽量铺满
  const padX = landscape ? W*.04 : 16, padY = 24;
  const rows = landscape ? 4 : 7;
  const cols = landscape ? Math.max(6, Math.min(9, Math.round((W-padX*2)/((H-padY*2)/rows)))) : 5;
  const c = Math.floor(Math.min((W-padX*2)/cols, (H-padY*2)/rows));
  Object.assign(ring,{c,cols,rows});
  const fw = c*cols, fh = c*rows;
  Object.assign(frame.style,{ width:fw+"px", height:fh+"px", left:((W-fw)/2)+"px", top:((H-fh)/2)+"px" });
  frame.style.setProperty("--c", c+"px");
  Object.assign(center.style,{ left:c+"px", top:c+"px", width:(fw-2*c)+"px", height:(fh-2*c)+"px" });

  // 四条边：top 往左、left 往下、bottom 往右、right 往上 → 整体逆时针流动
  const defs = [
    { name:"top",    x:0,        y:0,        w:fw, h:c,          axis:"x", dir:-1, vis:cols },
    { name:"right",  x:fw-c,     y:c,        w:c,  h:fh-2*c,     axis:"y", dir:-1, vis:rows-2 },
    { name:"bottom", x:0,        y:fh-c,     w:fw, h:c,          axis:"x", dir: 1, vis:cols },
    { name:"left",   x:0,        y:c,        w:c,  h:fh-2*c,     axis:"y", dir: 1, vis:rows-2 },
  ];
  // 按可见长度分配格子，每条边至少比可见多 1 格才能无缝循环
  const need = defs.map(d=>d.vis+1), total = TILES.length, spare = total - need.reduce((a,b)=>a+b,0);
  const weight = defs.map(d=>d.vis), wsum = weight.reduce((a,b)=>a+b,0);
  const counts = need.map((n,i)=>n + Math.floor(spare*weight[i]/wsum));
  let left = total - counts.reduce((a,b)=>a+b,0); for (let i=0; left>0; i=(i+1)%4, left--) counts[i]++;

  frame.querySelectorAll(".strip").forEach(s=>s.remove());
  ring.strips = []; let k = 0;
  defs.forEach((d,i)=>{
    const el = document.createElement("div"); el.className = "strip";
    Object.assign(el.style,{ left:d.x+"px", top:d.y+"px", width:d.w+"px", height:d.h+"px" });
    const tiles = TILES.slice(k, k+counts[i]).map(t=>{ const e = tileEl(t); el.appendChild(e); return e; });
    k += counts[i];
    frame.insertBefore(el, center);
    ring.strips.push({ ...d, tiles, len:tiles.length*c });
  });
  renderRing();
}

function renderRing(){
  const c = ring.c, off = ring.u*c;
  for (const s of ring.strips){
    s.tiles.forEach((el,j)=>{
      let p = mod(j*c + s.dir*off, s.len);
      if (p > s.len - c) p -= s.len;               // 跨过起点的那张，从另一头露出来
      el.style.transform = s.axis==="x" ? `translate3d(${p}px,0,0)` : `translate3d(0,${p}px,0)`;
    });
  }
}

/* 输入：滚轮 / 触摸拖动 / 键盘 → 只改目标位置，每帧插值追上 */
function nudge(d){ if (ring.preview) clearTouchPreview(); ring.tu += d; ring.lastInput = performance.now(); }
$("#home").addEventListener("wheel", e=>{ e.preventDefault(); nudge((e.deltaY+e.deltaX)/240); }, { passive:false });
let homeTouch = null;
$("#home").addEventListener("touchstart", e=>{
  ring.input = "touch"; ring.hover = false; updateTouchGuide();
  if (e.touches.length!==1){ homeTouch = null; ring.suppressUntil = performance.now()+600; return; }
  const t = e.touches[0];
  homeTouch = { x:t.clientX, y:t.clientY, last:t.clientX+t.clientY, moved:false };
}, { passive:true });
$("#home").addEventListener("touchmove", e=>{
  if (!homeTouch || e.touches.length!==1) return;
  const t = e.touches[0], v = t.clientX+t.clientY;
  if (Math.hypot(t.clientX-homeTouch.x,t.clientY-homeTouch.y)>8) homeTouch.moved = true;
  if (homeTouch.moved){ nudge(-(v-homeTouch.last)/ring.c*1.2); ring.suppressUntil = performance.now()+600; }
  homeTouch.last = v;
}, { passive:true });
const endHomeTouch = ()=>{
  if (homeTouch?.moved) ring.suppressUntil = performance.now()+600;
  homeTouch = null;
};
$("#home").addEventListener("touchend", endHomeTouch);
$("#home").addEventListener("touchcancel", endHomeTouch);
$("#home").addEventListener("click", e=>{
  if (ring.preview && e.target instanceof Element && !e.target.closest("a,button")) clearTouchPreview();
});
addEventListener("keydown", e=>{
  if (route.view!=="home") return;
  if (e.key==="ArrowDown"||e.key==="ArrowRight") nudge(1);
  if (e.key==="ArrowUp"||e.key==="ArrowLeft") nudge(-1);
});

/* ---------------- 首页：点阵粒子字（悬停照片时重组成章节名，并染上那张照片的颜色） ---------------- */
const cv = $("#dots"), ctx = cv.getContext("2d");
const P = { dots:[], mx:-1e4, my:-1e4, R:THEME.motion.repel, step:6, r:2.4, w:0, h:0, size:0, shapes:[], key:0, src:null, tinted:false, timer:0, tints:new Map() };
const HOME = THEME.home;
const cssRGB = name => { const h = getComputedStyle(document.documentElement).getPropertyValue(name).trim().slice(1); return [0,2,4].map(i=>parseInt(h.slice(i, i+2), 16)); };
const ACCENT = cssRGB("--accent"), PAPER = cssRGB("--bg"), INK = cssRGB("--ink");
const subEl = $("#center .sub"), lineEl = $("#center .places");
function setFont(g, s){ const f = THEME.font; g.font = `${f.weight} ${s}px "${f.family}", sans-serif`; if ("fontStretch" in g) g.fontStretch = f.stretch; }

// Long words with a space split into two lines
const wordLines = word => word.length > 9 && word.includes(" ") ? word.split(" ") : [word];
// Draw a word into a w×h canvas and sample points on a grid; never larger than the home word
function wordPoints(word){
  const { w, h, step } = P;
  const g = document.createElement("canvas").getContext("2d", { willReadFrequently:true });
  g.canvas.width = w; g.canvas.height = h;
  const lines = wordLines(word), L = lines.length;
  setFont(g, 100);
  const m = Math.max(...lines.map(l=>g.measureText(l).width));
  const size = Math.min(P.size, 100*w/m, h/(.86*L - .14));
  setFont(g, size); g.textAlign = "center"; g.fillStyle = g.strokeStyle = "#000";
  g.lineWidth = size*THEME.font.thicken; g.lineJoin = "round";   // a traced outline so thin strokes still yield points; the slab barely needs it
  const top = (h - size*(.86*L - .14))/2;
  lines.forEach((l,i)=>{ g.fillText(l, w/2, top + size*(.72 + .86*i)); if (g.lineWidth > 0) g.strokeText(l, w/2, top + size*(.72 + .86*i)); });
  const data = g.getImageData(0,0,w,h).data, pts = [];
  // 按列扫描：点位从左到右排好，变形时每个点大多只走一小段
  for (let x=step/2; x<w; x+=step) for (let y=step/2; y<h; y+=step)
    if (data[(Math.floor(y)*w + Math.floor(x))*4+3] > 128) pts.push([x,y]);
  return pts;
}

function sampleDots(intro){
  const dpr = Math.min(devicePixelRatio||1, 2);
  const cw = (ring.cols-2)*ring.c, chH = (ring.rows-2)*ring.c;
  // The home word sizes the canvas: 82% of the centre width, at most 42% of its height (46% when it splits into two lines)
  const g = document.createElement("canvas").getContext("2d"); setFont(g, 100);
  const lines = wordLines(HOME.word), lh = .86*lines.length - .14;
  const m = Math.max(...lines.map(l=>g.measureText(l).width)), size = Math.min(100*cw*.82/m, chH*(lines.length > 1 ? .46 : .42)/lh);
  const w = Math.round(m*size/100), h = Math.round(size*lh), step = Math.max(4, Math.round(w/108));
  Object.assign(P,{ w, h, size, step, r:step*.4, R:Math.max(48, step*11) });
  P.tints.clear();
  cv.width = w*dpr; cv.height = h*dpr; cv.style.width = w+"px"; cv.style.height = h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  P.shapes = [HOME.word, ...CHAPTERS.map(c=>THEME.font.upper ? c.en.toUpperCase() : c.en)].map(wordPoints);
  const N = Math.max(...P.shapes.map(s=>s.length));
  P.dots = Array.from({ length:N }, ()=>({ x:0, y:0, vx:0, vy:0, hx:0, hy:0, r:0, g:0, b:0, t:ACCENT, ph:Math.random()*Math.PI*2 }));   // ph: each dot's own glint phase
  setShape(P.key, P.src, false);
  for (const d of P.dots){
    if (intro && !reduce){ d.x = w/2 + (Math.random()-.5)*w*1.4; d.y = h/2 + (Math.random()-.5)*h*3; }
    else { d.x = d.hx; d.y = d.hy; }
    [d.r, d.g, d.b] = d.t;
  }
}

// k: 0 = home word, 1–6 = chapter; src: the photo to take colors from. Words with fewer points stack the extra dots
function setShape(k, src, burst=true){
  const pts = P.shapes[k], n = pts.length, N = P.dots.length, tint = src ? photoTint(src) : null;
  if (k===P.key) burst = false;
  P.dots.forEach((d,i)=>{
    const [x,y] = pts[Math.floor(i*n/N)];
    d.hx = x; d.hy = y; d.t = tint ? tintAt(tint, x, y) : ACCENT;
    if (burst && !reduce){ d.vx += (Math.random()-.5)*16; d.vy += (Math.random()-.5)*16; }   // 先炸开一下再归位
  });
  Object.assign(P, { key:k, src, tinted:!!tint });
  cv.setAttribute("aria-label", k ? CHAPTERS[k-1].en : HOME.word);
}
// 把照片按 cover 铺进文字画布，每个点取自己位置的颜色
// 照片的平均亮度（0–1），决定首页悬停音的音高
const LUMS = new Map();
function photoLum(src){
  if (LUMS.has(src)) return LUMS.get(src);
  for (const im of [tileImg(src), bakedImg(src)]){
    if (!im) continue;
    try {
      const g = document.createElement("canvas").getContext("2d", { willReadFrequently:true }); g.canvas.width = g.canvas.height = 16;
      g.drawImage(im, 0, 0, 16, 16); const d = g.getImageData(0,0,16,16).data; let L = 0;
      for (let i=0; i<d.length; i+=4) L += lumOf(d[i], d[i+1], d[i+2]);
      LUMS.set(src, L/256); return L/256;
    } catch(e){}
  }
  return null;
}
// 已经加载好的照片环缩略图
function tileImg(src){
  const img = $(`.tile img[src="photos/sq/${src}.jpg"]`);
  return img && img.complete && img.naturalWidth ? img : null;
}
// 用 file:// 直接打开时浏览器不让读照片像素，改用 photos/tints.js 里预先缩好的 32×32 色块（bake_tints.py 生成）
const BAKED = new Map();
function bakedImg(src){
  if (BAKED.has(src)) return BAKED.get(src);
  const T = window.PHOTO_TINTS, b = T && T.data[src]; if (!b) return null;
  const raw = atob(b), g = document.createElement("canvas").getContext("2d"); g.canvas.width = g.canvas.height = T.size;
  const im = g.createImageData(T.size, T.size);
  for (let i=0, j=0; i<raw.length; i+=3, j+=4){ im.data[j] = raw.charCodeAt(i); im.data[j+1] = raw.charCodeAt(i+1); im.data[j+2] = raw.charCodeAt(i+2); im.data[j+3] = 255; }
  g.putImageData(im, 0, 0); BAKED.set(src, g.canvas); return g.canvas;
}
function photoTint(src){
  if (P.tints.has(src)) return P.tints.get(src);
  for (const im of [tileImg(src), bakedImg(src)]){
    if (!im) continue;
    try {
      const g = document.createElement("canvas").getContext("2d", { willReadFrequently:true });
      g.canvas.width = P.w; g.canvas.height = P.h;
      const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
      const s = Math.max(P.w/iw, P.h/ih), dw = iw*s, dh = ih*s;
      g.drawImage(im, (P.w-dw)/2, (P.h-dh)/2, dw, dh);
      const data = g.getImageData(0,0,P.w,P.h).data;
      P.tints.set(src, data); return data;
    } catch(e){}   // 读不到像素就试下一个来源，都不行才退回主色
  }
  return null;
}
// 太浅的颜色压暗一点，免得在米白底上看不见
function tintAt(data, x, y){
  const i = (Math.floor(y)*P.w + Math.floor(x))*4; let r = data[i], g = data[i+1], b = data[i+2];
  const m = (r+g+b)/3; r = m+(r-m)*1.4; g = m+(g-m)*1.4; b = m+(b-m)*1.4;   // 饱和度提一点，暗照片也不发灰
  const L = r*.299 + g*.587 + b*.114;
  if (L > 190){ const k = 190/L; r *= k; g *= k; b *= k; }
  return [r,g,b].map(v=>Math.max(0, Math.min(255, v)));
}
// 悬停防抖：进入照片 0.11 秒后变字；离开 0.28 秒后才变回首页大字，在照片之间滑动不会闪回
function hoverChapter(ci, src){
  clearTimeout(P.timer);
  P.timer = setTimeout(()=>{
    if (route.view!=="home" || ring.preview) return;
    if (!P.shapes.length) sampleDots(false);
    const k = ci<0 ? 0 : ci+1;
    if (k!==P.key) setCaption(ci);
    setShape(k, ci<0 ? null : src);
  }, ci<0 ? 280 : 110);
}
function setCaption(ci){
  const ch = CHAPTERS[ci];
  subEl.textContent = ci<0 ? HOME.sub : ring.input==="touch" ? `CH.${pad2(ci+1)} / ${ch.zh}` : `CH.${pad2(ci+1)} / ${ch.zh} / ${pad2(ch.photos.length)} photos`;
  if (ci<0) subEl.append(authorLink(`A travel journal by ${THEME.author.name}`, "home-byline"));
  lineEl.textContent = ci<0 ? HOME.line : ch.line;
  if (!reduce) [subEl, lineEl].forEach(el=>el.animate([{ opacity:0, transform:"translateY(6px)" },{ opacity:1, transform:"none" }], { duration:380, easing:"cubic-bezier(.2,.7,.2,1)" }));
}

function stepDots(){
  const { mx, my, R } = P, R2 = R*R; let settled = true;
  for (const d of P.dots){
    const dx = d.x - mx, dy = d.y - my, q = dx*dx + dy*dy;
    if (q < R2 && q > .01){
      const dist = Math.sqrt(q), f = (1 - dist/R) * 3.2;
      d.vx += dx/dist*f; d.vy += dy/dist*f;
    }
    d.vx += (d.hx - d.x)*THEME.motion.spring; d.vy += (d.hy - d.y)*THEME.motion.spring;   // 弹簧拉回原位
    d.vx *= THEME.motion.damp; d.vy *= THEME.motion.damp;                               // 阻尼：抖一下再停
    d.x += d.vx; d.y += d.vy;
    d.r += (d.t[0]-d.r)*.08; d.g += (d.t[1]-d.g)*.08; d.b += (d.t[2]-d.b)*.08;
    if (settled && Math.abs(d.t[0]-d.r) + Math.abs(d.t[1]-d.g) + Math.abs(d.t[2]-d.b) > 3) settled = false;
  }
  ctx.clearRect(0,0,P.w,P.h);
  // dots: glint — round dots that each catch the light now and then, like sun on the lake (Glitter chapter);
  // a slow swell runs left to right across the word, and pushed dots flash brighter
  const now = reduce ? 0 : performance.now();
  if (!P.tinted && settled){                               // all accent: one path for every dot
    ctx.fillStyle = `rgb(${ACCENT})`; ctx.beginPath();
    for (const d of P.dots) glintOf(d, now);
    ctx.fill(); return;
  }
  for (const d of P.dots){
    ctx.fillStyle = `rgb(${d.r|0},${d.g|0},${d.b|0})`;
    ctx.beginPath(); glintOf(d, now); ctx.fill();
  }
}
function glintOf(d, now){
  const swell = Math.sin(now*.0011 - d.hx*.035)*.5 + .5, flash = Math.max(0, Math.sin(now*.0019 + d.ph))**12;
  const r = reduce ? P.r : P.r*(.72 + .22*swell + .55*flash + Math.min(.4, Math.hypot(d.vx, d.vy)*.05));
  ctx.moveTo(d.x + r, d.y); ctx.arc(d.x, d.y, r, 0, Math.PI*2);
}

const chV = $("#chViewport"), chT = $("#chTrack"), chBar = $("#chBar");

function buildChapter(ci, focus){

  chT.innerHTML = ch.photos.map((p,i)=>`

function measureChapter(){
  // 按可用高度和照片原始比例算尺寸；横图太宽就按屏宽收，保证比例不变形
  const H = chV.clientHeight - 56, Wmax = chV.clientWidth*.86, k = Math.min(2, devicePixelRatio||1);
  let dirty = false;
  for (const el of chT.children){
    const ar = +el.dataset.ar; let h = H, w = h*ar;
    if (w > Wmax){ w = Wmax; h = w/ar; }
    el.style.width = w+"px";
    Object.assign(el.querySelector(".pic").style,{ width:w+"px", height:h+"px" });
    // 风格层的像素尺寸：跟显示尺寸走，最长边不超过 1100，保证切换够快
    const fx = el.querySelector(".fx"), cap = Math.min(1, 1100/(Math.max(w,h)*k));
    const W = Math.round(w*k*cap), Hh = Math.round(h*k*cap);
    if (fx.width!==W || fx.height!==Hh){ fx.width = W; fx.height = Hh; dirty = true; }

  CH.figs = [...chT.children].map(el=>({ el, img:el.querySelector("img"), fx:el.querySelector(".fx"), wipe:el.querySelector(".wipe"),
    pal:el.querySelector(".pal"), keep:el.classList.contains("keep"), src:el.dataset.src, c:el.offsetLeft + el.offsetWidth/2 }));
  CH.max = Math.max(0, chT.scrollWidth - chV.clientWidth);
  CH.tx = Math.min(CH.tx, CH.max);
  if (dirty && FX.style!=="orig") CH.figs.forEach(paintFx);   // 换章或改窗口大小后，按当前风格重画
}

  const vw = chV.clientWidth;
  for (const f of CH.figs){
    const rel = (f.c - CH.x - vw/2)/vw;                       // 视差：越靠边，图片在框里偏得越多
    f.img.style.transform = f.fx.style.transform = `translate3d(${rel*-32}px,0,0) scale(1.08)`;

}

chT.addEventListener("focusin", e=>{

function coverCanvas(img, W, H, filter){
  const g = document.createElement("canvas").getContext("2d", { willReadFrequently:true });
  g.canvas.width = W; g.canvas.height = H; if (filter) g.filter = filter;

}
// The photos' own deep blue: the sky over Holy Hill, img-1194 palette #154E95 (213°); the trip's second colour, the farthest hue from the gold
const LAKE = [21,78,149], SKY = [24,95,188];   // SKY: img-1290 #185FBC (214°), second accent candidate
// Cyanotype: a sun print — shadows soak into the deep Holy Hill blue, highlights stay paper, with a little paper fibre
function fxCyan(img, W, H){
  const g = coverCanvas(img, W, H, "contrast(1.1)"), im = g.getImageData(0,0,W,H), d = im.data;
  for (let y=0; y<H; y++){
    const row = Math.sin(y*.9)*.012;                                       // faint horizontal fibre
    for (let x=0; x<W; x++){
      const i = (y*W + x)*4, L = lumOf(d[i], d[i+1], d[i+2]), n = (Math.random()-.5)*.07 + row;
      let k = Math.pow(1 - L, 1.15)*1.25 + n; k = k<0 ? 0 : k>1 ? 1 : k;   // how much the paper "took" the blue
      for (let c=0; c<3; c++) d[i+c] = PAPER[c] + (LAKE[c]*.82 - PAPER[c])*k;
    }
  }
  g.putImageData(im, 0, 0); return { canvas:g.canvas };
}
// Riso: two inks, misregistered — cheddar gold (ACCENT) for the warm mid-tones, sky blue for the shadows and the sky, with grain
function fxRiso(img, W, H){
  const g = coverCanvas(img, W, H), im = g.getImageData(0,0,W,H), d = im.data, L = new Float32Array(W*H), B = new Float32Array(W*H);
  for (let i=0, p=0; p<L.length; i+=4, p++){ L[p] = lumOf(d[i], d[i+1], d[i+2]); B[p] = (d[i+2] - d[i])/255; }   // B: how blue a pixel is
  const off = Math.max(2, Math.round(W/300)), clamp = v => v<0 ? 0 : v>1 ? 1 : v;
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    const p = y*W + x, q = Math.min(H-1, y+off)*W + Math.min(W-1, x+off), n = (Math.random()-.5)*.28;
    const gold = clamp((.86 - L[p])*1.5 - B[p]*.9 + n);                   // gold drum: warm mid-tones
    const blue = clamp((.62 - L[q])*1.9 + B[q]*1.4 + n*.8);                // blue drum: shadows and sky, printed a little off-register
    for (let c=0, i=p*4; c<3; c++) d[i+c] = PAPER[c] * (1 - gold*.9*(1 - ACCENT[c]/255)) * (1 - blue*.9*(1 - SKY[c]/255));

}
// 色块：k-means 取 5 个主色，把照片压成平面色块，并给出色卡
function fxBlock(img, W, H){
  const sw = Math.max(80, Math.round(W/3)), sh = Math.max(80, Math.round(H/3));
  const g = coverCanvas(img, sw, sh, "blur(1.2px)"), im = g.getImageData(0,0,sw,sh), d = im.data;
  const px = []; for (let i=0; i<d.length; i+=20) px.push([d[i], d[i+1], d[i+2]]);
  px.sort((a,b)=>lumOf(...a) - lumOf(...b));
  let C = [.08,.3,.5,.7,.92].map(q=>[...px[Math.floor(q*(px.length-1))]]);   // 按亮度分位数起步，结果稳定
  const near = (r,gg,b) => { let bi = 0, bd = 1e9; C.forEach((c,j)=>{ const e = (c[0]-r)**2 + (c[1]-gg)**2 + (c[2]-b)**2; if (e < bd){ bd = e; bi = j; } }); return bi; };
  for (let it=0; it<10; it++){
    const sum = C.map(()=>[0,0,0,0]);
    for (const p of px){ const s = sum[near(...p)]; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++; }
    C = C.map((c,j)=>sum[j][3] ? [sum[j][0]/sum[j][3], sum[j][1]/sum[j][3], sum[j][2]/sum[j][3]] : c);
  }

  for (let i=0; i<d.length; i+=4){ const j = near(d[i], d[i+1], d[i+2]); share[j]++; d[i] = C[j][0]; d[i+1] = C[j][1]; d[i+2] = C[j][2]; }

}

async function paintFx(f){

  if (!f.img.complete || !f.img.naturalWidth) await f.img.decode().catch(()=>{});
  const W = f.fx.width, H = f.fx.height, key = `${f.src}|${id}|${W}x${H}`;
  let out = FX.cache.get(key);

    try { out = FX_FN[id](f.img, W, H); }
    catch(e){ $("#chLine").textContent = "Print styles need a local server (a double-clicked html file cannot read photo pixels)."; return; }
    FX.cache.set(key, out);
    if (FX.cache.size > 14) FX.cache.delete(FX.cache.keys().next().value);   // 只留最近的十几张，省内存
  }
  if (FX.style!==id) return;
  const g = f.fx.getContext("2d"); g.clearRect(0,0,W,H); g.drawImage(out.canvas, 0, 0);
  f.pal.innerHTML = out.palette ? out.palette.map(p=>`<i style="--sw:${p.hex};flex:${Math.max(.6, p.share*5).toFixed(2)}" title="${p.hex}"></i>`).join("") : "";

}
function markStyle(id){ stylesEl.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.s===id))); }
// 一键切整章：每张错开一点，强调色色块盖上 → 换风格 → 揭开。动画进行中再点，就排到这一轮结束后

let lbTok = 0;
const dprOf = () => Math.min(2, devicePixelRatio || 1);

// 一半一半往下缩的图像金字塔：取某个格子的平均色时，从最接近的一层缩，颜色才准
function pyramid(src){
  const out = [src]; let c = src, [w, h] = sizeOf(src);
  while (Math.min(w, h) > 48){
    w = Math.ceil(w/2); h = Math.ceil(h/2);
    const n = document.createElement("canvas"); n.width = w; n.height = h; n.getContext("2d").drawImage(c, 0, 0, w, h);

function shrink(pyr, w, h){

  const g = document.createElement("canvas").getContext("2d", { willReadFrequently:true });
  g.canvas.width = w; g.canvas.height = h; g.imageSmoothingQuality = "high"; g.drawImage(s, 0, 0, w, h);

}
function lbPalette(pyr){                       // 原片的 5 个主色（k-means，按亮度分位数起步）
  const d = shrink(pyr, 48, 48), px = [];
  for (let i=0; i<d.length; i+=4) px.push([d[i], d[i+1], d[i+2]]);
  px.sort((a,b)=>lumOf(...a) - lumOf(...b));
  let C = [.08,.3,.5,.7,.92].map(q=>[...px[Math.floor(q*(px.length-1))]]), n = [];
  for (let it=0; it<10; it++){
    const s = C.map(()=>[0,0,0]); n = C.map(()=>0);
    for (const p of px){
      let bi = 0, bd = 1e9;
      C.forEach((c,j)=>{ const e = (c[0]-p[0])**2 + (c[1]-p[1])**2 + (c[2]-p[2])**2; if (e < bd){ bd = e; bi = j; } });
      s[bi][0] += p[0]; s[bi][1] += p[1]; s[bi][2] += p[2]; n[bi]++;
    }
    C = C.map((c,j)=>n[j] ? s[j].map(v=>v/n[j]) : c);
  }
  return C.map((c,j)=>({ rgb:c.map(Math.round), share:n[j]/px.length })).sort((a,b)=>b.share - a.share);

// 一张照片要用的东西：原图、像素（取色用）、金字塔、主色。按下鼠标时就开始准备，松手时多半已经好了
function lbItem(ci, i){

    LB_ITEMS.set(p.src, (async ()=>{
      const img = new Image(); img.src = `photos/full/${p.src}.jpg`; await img.decode();
      const W = img.naturalWidth, H = img.naturalHeight, g = document.createElement("canvas").getContext("2d", { willReadFrequently:true });
      g.canvas.width = W; g.canvas.height = H; g.drawImage(img, 0, 0);

    })().catch(e=>{ LB_ITEMS.delete(p.src); throw e; }));

function lbRect(it){

// 章节当前是什么风格，大图就显影成什么风格；原作保留的风格作品不处理
function lbSource(it, R){
  const id = curStyle();
  if (id==="orig" || it.p.credit) return { cv:it.img, pyr:it.pyr };
  const d = dprOf(), cap = Math.min(1, 1200/(Math.max(R.w, R.h)*d));
  const W = Math.round(R.w*d*cap), H = Math.round(R.h*d*cap), key = `${id}|${W}x${H}`;
  if (!it.styled.has(key)){ const cv = FX_FN[id](it.img, W, H).canvas; it.styled.clear(); it.styled.set(key, { cv, pyr:pyramid(cv) }); }

/* 点阵：每一级先画成一张离屏图，动画里只贴图，不逐点重画 */
function lbGrid(j){

  const g = c.getContext("2d"), r = Math.min(G.cw, G.ch)*.5; g.scale(d, d);
  for (let y=0; y<G.rows; y++) for (let x=0; x<G.cols; x++){
    const o = (y*G.cols + x)*4; g.fillStyle = `rgb(${G.d[o]},${G.d[o+1]},${G.d[o+2]})`;
    g.beginPath(); g.arc((x+.5)*G.cw, (y+.5)*G.ch, r, 0, Math.PI*2); g.fill();
  }
  return LB.levels[j] = c;
}
function lbBakeAhead(){ for (let j=0; j<LB_STEPS.length; j++) if (!LB.levels[j]){ lbLevel(j); return; } }   // 每帧最多预画一级，不卡
// k：0 是最粗的点阵，1 是照片。相邻两级交叉淡入，点是连续变细的，不是一级一级跳
function lbDrawDev(k){
  const n = LB_STEPS.length, pos = clamp01(k)*n, R = LB.rect;
  lbG.clearRect(0, 0, innerWidth, innerHeight);
  if (pos < n-1){
    const a = Math.floor(pos), f = easeSine(pos - a);
    lbG.globalAlpha = 1 - f; lbG.drawImage(lbLevel(a), R.x, R.y, R.w, R.h);
    lbG.globalAlpha = Math.min(1, f*1.6); lbG.drawImage(lbLevel(a+1), R.x, R.y, R.w, R.h);
  } else {
    lbG.drawImage(lbLevel(n-1), R.x, R.y, R.w, R.h);
    lbG.globalAlpha = easeSine(pos - (n-1)); lbG.drawImage(LB.src.cv, R.x, R.y, R.w, R.h);
  }

}
function lbThumb(){                            // 缩略图此刻在屏幕上的位置（章节页有视差，它会动）
  const pic = CH.figs[LB.i]?.el.querySelector(".pic");
  if (pic) return pic.getBoundingClientRect();
  return { left:innerWidth/2 - 30, top:innerHeight/2 - 30, width:60, height:60 };
}
function lbDots(){                             // 聚拢用的粒子：最粗那一级点阵的每个点，都记住它在缩略图里的相对位置
  const R = LB.rect, G = lbGrid(0), dots = [];
  for (let y=0; y<G.rows; y++) for (let x=0; x<G.cols; x++){
    const o = (y*G.cols + x)*4, u = (x+.5)/G.cols, v = (y+.5)/G.rows;
    dots.push({ u:u + (Math.random()-.5)*.2, v:v + (Math.random()-.5)*.2, ex:R.x + u*R.w, ey:R.y + v*R.h,
      c:[G.d[o], G.d[o+1], G.d[o+2]], r:Math.min(G.cw, G.ch)*.5, bend:(Math.random()-.5)*.7,
      delay:Math.hypot(u-.5, v-.5)/.71*.75 + Math.random()*.25 });   // 离中心越远越晚出发
  }
  LB.dots = dots;
}
function lbDrawDots(t, back){
  const T = lbThumb(), D = .34;
  lbG.clearRect(0, 0, innerWidth, innerHeight);
  for (const d of LB.dots){
    const lt = clamp01((t - d.delay*D)/(1 - D));
    const e = back ? 1 - easeIO(lt) : easeBack(lt);
    const sx = T.left + d.u*T.width, sy = T.top + d.v*T.height;
    // 二次贝塞尔：控制点偏到连线一侧，每个点走一条略弯的路
    const mx = (sx + d.ex)/2 + (d.ey - sy)*d.bend*.5, my = (sy + d.ey)/2 - (d.ex - sx)*d.bend*.5;
    const q = 1 - e, x = q*q*sx + 2*q*e*mx + e*e*d.ex, y = q*q*sy + 2*q*e*my + e*e*d.ey;
    const tint = back ? 1 : clamp01(lt*1.6 - .1), a = back ? clamp01((1 - lt)*3) : clamp01(lt*5);
    if (a <= 0) continue;
    const r = d.r*(.3 + .7*clamp01(e));
    lbG.globalAlpha = a;
    lbG.fillStyle = `rgb(${ACCENT[0] + (d.c[0]-ACCENT[0])*tint|0},${ACCENT[1] + (d.c[1]-ACCENT[1])*tint|0},${ACCENT[2] + (d.c[2]-ACCENT[2])*tint|0})`;
    lbG.beginPath(); lbG.arc(x, y, r, 0, Math.PI*2); lbG.fill();
  }
  lbG.globalAlpha = 1;
}
// 一段补间动画；新动画开始或大图被重置时，旧的自动作废（返回 false）
function tween(dur, draw){
  const tok = ++lbTok;
  return new Promise(res=>{
    const t0 = performance.now();
    const f = now=>{
      if (tok!==lbTok) return res(false);
      const t = Math.min(1, (now - t0)/dur); draw(t);
      t < 1 ? requestAnimationFrame(f) : res(true);
    };
    requestAnimationFrame(f);
  });
}
function lbDevelop(k0, k1, dur){
  const n = LB_STEPS.length;
  return tween(dur, t=>{
    const k = LB.k = k0 + (k1 - k0)*easeSine(t);
    lbDrawDev(k); lbBakeAhead();
    const s = Math.floor(k*n);
    if (k1 > k0 && s > LB.step && s < n){ LB.step = s; lbSnd("step", s); }   // 显影每细一级响一个音
  });
}

/* ---------------- 打开、切换、换风格、关闭 ---------------- */
function lbFillText(){
  const ch = CHAPTERS[LB.ci], p = ch.photos[LB.i], st = STYLES.find(s=>s.id===curStyle());
  $("#lbCh").innerHTML = `CH.${pad2(LB.ci+1)} — ${ch.en}<span>${ch.zh}</span>`;
  $("#lbNo").innerHTML = `${pad2(LB.i+1)}<span> / ${pad2(ch.photos.length)}</span>`;
  $("#lbCap").textContent = p.cap;
  $("#lbMode").innerHTML = p.credit ? `Original work<span>kept as made, no print style</span>`
    : st.id==="orig" ? `Original<span>as shot</span>` : `${st.en}<span>${st.zh} · the loupe shows the original</span>`;
  const cr = $("#lbCred"), [work, by] = (p.credit || "").split(" · ");
  cr.hidden = !p.credit;
  cr.innerHTML = p.credit ? `<em class="x">Style work</em>${work}<br>by ${by}${p.license ? `<br>${p.license}` : ""}` : "";
}
function lbFillData(){
  $("#lbPal").innerHTML = LB.item.pal.map(c=>{ const h = hexOf(c.rgb);
    return `<button type="button" data-hex="${h}" title="Copy hex"><i style="background:${h}"></i><b>${h}</b><span>${Math.round(c.share*100)}%</span></button>`; }).join("");
  lbReadout(null);
}
function lbFail(){
  $("#chLine").textContent = "The viewer needs a local server (a double-clicked html file cannot read photo pixels).";
  history.replaceState(null, "", `#/ch/${LB.ci+1}`); lbReset();
}
async function lbOpen(ci, i, pushed){
  if (LB.open) return;
  Object.assign(LB, { open:true, closing:false, busy:true, ci, i, pushed, phase:"open", step:-1, k:0 });
  lb.classList.add("open"); lb.setAttribute("aria-hidden", "false"); lbStage.style.cursor = "";
  lbFillText();
  let it; try { it = await lbItem(ci, i); } catch(e){ lbFail(); return; }
  if (!LB.open || LB.closing) return;
  LB.item = it; lbLayout(); lbFillData();
  sndDuck(true); lbSnd("open");
  $("#lbClose").focus({ preventScroll:true });
  if (!reduce){ lbDots(); if (!await tween(THEME.motion.gather, t=>{ lbDrawDots(t, false); lbBakeAhead(); })) return; }
  if (!await lbDevelop(0, 1, reduce ? 1 : THEME.motion.develop)) return;
  lbShown();
}
function lbShown(){ LB.busy = false; LB.phase = "shown"; LB.k = 1; lbDrawDev(1); lbSnd("done"); }
async function lbSwitch(d){
  if (!LB.open || LB.busy || LB.closing) return;
  const n = CHAPTERS[LB.ci].photos.length, i = mod(LB.i + d, n), next = lbItem(LB.ci, i);
  next.catch(()=>{});
  LB.busy = true; LB.phase = "swap"; lpHide(); lbSnd("swap");
  history.replaceState(null, "", `#/ch/${LB.ci+1}/${i+1}/view`);   // 换张不进浏览器历史，返回键直接关掉大图
  if (!await lbDevelop(LB.k, 0, reduce ? 1 : 420)) return;
  let it; try { it = await next; } catch(e){ lbFail(); return; }
  if (!LB.open || LB.closing) return;
  LB.i = i; LB.item = it; LB.step = -1; lbLayout(); lbFillText(); lbFillData();
  if (!await lbDevelop(0, 1, reduce ? 1 : 1000)) return;
  lbShown();
}
async function lbRestyle(id){                  // 大图里按 1–4：章节背后一起换，大图退回半粗点阵再显影成新风格
  setStyle(id, true);
  if (!LB.open || LB.busy || LB.closing || !LB.item) return;
  lbFillText();
  if (LB.item.p.credit) return;
  LB.busy = true; LB.phase = "swap"; lpHide(); lbSnd("swap");
  if (!await lbDevelop(1, .45, reduce ? 1 : 380)) return;
  LB.src = lbSource(LB.item, LB.rect); LB.levels = []; LB.step = Math.floor(.45*LB_STEPS.length);
  if (!await lbDevelop(.45, 1, reduce ? 1 : 700)) return;
  lbShown();
}
// 从章节页点开的大图，关闭时走浏览器的返回，历史记录保持干净；直接打开链接进来的，就原地改网址
function lbRequestClose(){
  if (!LB.open || LB.closing) return;
  if (LB.pushed) history.back();
  else { history.replaceState(null, "", `#/ch/${LB.ci+1}`); lbClose(); }
}
async function lbClose(){
  if (!LB.open || LB.closing) return;
  LB.closing = true; LB.busy = true; LB.phase = "close"; lpHide();
  LB.refocus = lb.contains(document.activeElement);            // 侧栏收起后焦点会丢，先记下来
  sndDuck(false); lbSnd("close");
  const f = CH.figs[LB.i]; if (f) CH.tx = Math.max(0, Math.min(CH.max, f.c - chV.clientWidth/2));   // 章节页滚到这张，点才飞得回去
  if (LB.item && LB.rect && !reduce){
    if (!await lbDevelop(LB.k, 0, 450)) return;
    lbDots(); lb.classList.remove("open");
    if (!await tween(750, t=>lbDrawDots(t, true))) return;
  }
  lbReset();
}
function lbReset(){
  lbTok++; sndDuck(false);
  const back = LB.refocus || lb.contains(document.activeElement); LB.refocus = false;
  Object.assign(LB, { open:false, closing:false, busy:false, phase:"idle", item:null, rect:null, src:null, levels:[], dots:[] });
  lb.classList.remove("open"); lb.setAttribute("aria-hidden", "true"); lpHide();
  lbG.clearRect(0, 0, innerWidth, innerHeight);
  if (back) CH.figs[LB.i]?.el.querySelector(".pic")?.focus({ preventScroll:true });
}
function lbSync(r){                            // 同一章里网址变了：只开关、切换大图
  if (r.photo < 0){ if (LB.open) lbClose(); return; }
  if (!LB.open){ const pushed = LB.pushNext; LB.pushNext = false; lbOpen(r.ci, r.photo, pushed); }
  else if (r.photo!==LB.i) lbSwitch(r.photo - LB.i);
}
function lbFromPic(pic){
  if (LB.open) return;
  const i = [...chT.children].indexOf(pic.closest(".fig")); if (i < 0) return;
  LB.pushNext = true; location.hash = `#/ch/${route.ci+1}/${i+1}/view`;
}

/* ---------------- 放大镜：跟手带一点惯性；放大超过原图像素时直接显示像素格 ---------------- */
const LP = { on:false, x:0, y:0, tx:0, ty:0, z:3, tz:3, touch:false, raf:0, deg:-1, at:0, hex:"" };
function lpInside(cx, cy){ const R = LB.rect; return !!R && cx>=R.x && cx<=R.x+R.w && cy>=R.y && cy<=R.y+R.h; }
function lpSample(nx, ny){                     // 3×3 取平均，避免取到单个噪点
  const { px, W, H } = LB.item, c = [0,0,0];
  for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){
    const x = Math.min(W-1, Math.max(0, Math.round(nx)+dx)), y = Math.min(H-1, Math.max(0, Math.round(ny)+dy)), o = (y*W + x)*4;
    c[0] += px[o]; c[1] += px[o+1]; c[2] += px[o+2];
  }
  return c.map(v=>Math.round(v/9));
}
function lpMove(cx, cy, touch){
  if (LB.phase!=="shown") return;
  const R = LB.rect;
  if (touch){ cx = Math.min(R.x + R.w, Math.max(R.x, cx)); cy = Math.min(R.y + R.h, Math.max(R.y, cy)); }
  const inside = lpInside(cx, cy);
  lbStage.style.cursor = inside ? "none" : "zoom-out";
  if (!inside){ lpHide(); lbReadout(null); return; }
  LP.tx = cx; LP.ty = cy; LP.touch = touch;
  if (!LP.on){ LP.on = true; LP.x = cx; LP.y = cy; loupe.classList.add("on"); }
  lpKick(); lpListen(cx, cy);
}
function lpHide(){ LP.on = false; loupe.classList.remove("on"); }
function lpKick(){ if (!LP.raf) LP.raf = requestAnimationFrame(lpFrame); }
function lpFrame(){
  LP.raf = 0; if (!LP.on || !LB.item) return;
  LP.x += (LP.tx - LP.x)*.35; LP.y += (LP.ty - LP.y)*.35; LP.z += (LP.tz - LP.z)*.25;
  lpDraw();
  if (Math.abs(LP.tx - LP.x) + Math.abs(LP.ty - LP.y) > .2 || Math.abs(LP.tz - LP.z) > .005) lpKick();
}
function lpDraw(){
  const R = LB.rect, it = LB.item, L = innerWidth <= 700 ? 150 : 210, d = dprOf(), S = lbStage.getBoundingClientRect();
  if (LP.L !== L || lpCv.width !== L*d){ LP.L = L; lpCv.width = lpCv.height = L*d; loupe.style.setProperty("--L", L + "px"); }
  // 显示位置：手指操作时放在手指上方；靠边时收进来。取样点始终是指针所在处
  const px = Math.min(S.right - L/2 - 10, Math.max(S.left + L/2 + 10, LP.x));
  const py = Math.min(S.bottom - L/2 - 40, Math.max(S.top + L/2 + 10, LP.y - (LP.touch ? L*.85 : 0)));
  loupe.style.transform = `translate3d(${px - L/2}px,${py - L/2}px,0)`;
  const nx = (LP.x - R.x)/R.w*it.W, ny = (LP.y - R.y)/R.h*it.H;
  const per = LP.z*R.w/it.W, span = L/per, x0 = nx - span/2, y0 = ny - span/2;   // per：原图一个像素放大后占几个点
  lpG.fillStyle = `rgb(${PAPER})`; lpG.fillRect(0, 0, lpCv.width, lpCv.height);
  lpG.imageSmoothingEnabled = per < 2.5; lpG.imageSmoothingQuality = "high";
  lpG.drawImage(it.img, x0, y0, span, span, 0, 0, lpCv.width, lpCv.height);   // 放大镜里永远是原片
  if (per >= 4){
    const s = per*d; lpG.strokeStyle = `rgba(${PAPER},.14)`; lpG.lineWidth = 1; lpG.beginPath();
    for (let g = Math.ceil(x0); g < x0 + span; g++){ const X = Math.round((g - x0)*s) + .5; lpG.moveTo(X, 0); lpG.lineTo(X, lpCv.height); }
    for (let g = Math.ceil(y0); g < y0 + span; g++){ const Y = Math.round((g - y0)*s) + .5; lpG.moveTo(0, Y); lpG.lineTo(lpCv.width, Y); }
    lpG.stroke();
  }
  $("#lpZ").textContent = "×" + Math.round(LP.tz*10)/10 + (per >= 2.5 ? " · PX" : "");
  lbReadout(lpSample(nx, ny), nx, ny);
}
function lbReadout(rgb, nx, ny){
  const el = $("#lbRead");
  if (!rgb){
    LP.hex = ""; el.classList.add("empty"); el.style.background = el.style.color = "";
    $("#lbHex").textContent = innerWidth <= 700 ? "Hold and drag over the photo" : "Move the pointer over the photo";
    $("#lbRgb").textContent = $("#lbXY").textContent = ""; return;
  }
  $("#lbXY").textContent = `X ${nx|0} · Y ${ny|0}`;
  const h = hexOf(rgb); if (h===LP.hex) return; LP.hex = h;
  el.classList.remove("empty"); el.style.background = h; el.style.color = `rgb(${lumOf(...rgb) > .6 ? INK : PAPER})`;
  $("#lbHex").textContent = $("#lpHex").textContent = h; $("#lbRgb").textContent = `R${rgb[0]} G${rgb[1]} B${rgb[2]}`;
  $("#lpSw").style.background = h;
}
// 听照片：指针下的亮度换成 THEME.scale 里的一个音，越亮越高，颜色越艳越响；只在换到新音时响
function lpListen(cx, cy){
  if (!sndReady()) return;
  const now = performance.now(); if (now - LP.at < 110) return;
  const R = LB.rect, it = LB.item, c = lpSample((cx - R.x)/R.w*it.W, (cy - R.y)/R.h*it.H);
  const deg = Math.round(lumOf(...c)*9); if (deg===LP.deg) return;
  LP.deg = deg; LP.at = now;
  lbSnd("look", deg, .45 + (Math.max(...c) - Math.min(...c))/255*.55);
}

lbStage.addEventListener("pointermove", e=>{ if (e.pointerType==="mouse" || e.buttons) lpMove(e.clientX, e.clientY, e.pointerType!=="mouse"); });
lbStage.addEventListener("pointerdown", e=>{
  if (LB.phase!=="shown") return;
  if (!lpInside(e.clientX, e.clientY)) return lbRequestClose();          // 点照片外的空白处关闭
  if (e.pointerType!=="mouse"){ try { lbStage.setPointerCapture(e.pointerId); } catch(err){} lpMove(e.clientX, e.clientY, true); }
});
lbStage.addEventListener("pointerup", e=>{ if (e.pointerType!=="mouse") lpHide(); });
lbStage.addEventListener("pointerleave", e=>{ if (e.pointerType==="mouse"){ lpHide(); lbReadout(null); } });
lbStage.addEventListener("wheel", e=>{
  e.preventDefault(); if (LB.phase!=="shown") return;
  const zMax = Math.max(10, 8*LB.item.W/LB.rect.w);              // 最大倍数：总能放到原图一个像素占 8 个点
  LP.tz = Math.max(1.5, Math.min(zMax, LP.tz*(e.deltaY < 0 ? 1.15 : 1/1.15)));
  lpMove(e.clientX, e.clientY, false);
}, { passive:false });
$("#lbClose").addEventListener("click", lbRequestClose);
$("#lbPrev").addEventListener("click", ()=>lbSwitch(-1));
$("#lbNext").addEventListener("click", ()=>lbSwitch(1));
$("#lbPal").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  navigator.clipboard?.writeText(b.dataset.hex).then(()=>{ const t = b.querySelector("span"), o = t.textContent; t.textContent = "Copied"; setTimeout(()=>t.textContent = o, 900); }).catch(()=>{});
});
addEventListener("keydown", e=>{
  if (!LB.open) return;
  if (e.key==="Escape") lbRequestClose();
  else if (e.key==="ArrowRight" || e.key==="ArrowDown") lbSwitch(1);
  else if (e.key==="ArrowLeft" || e.key==="ArrowUp") lbSwitch(-1);
  else if (/^[1-4]$/.test(e.key)) lbRestyle(STYLES[+e.key-1].id);
  else return;
  e.preventDefault();
});

/* ---------------- 声音：全部由浏览器现场合成，不用任何音乐文件 ---------------- */
const SND = { on:THEME.soundOn, active:false, ac:null, amb:null, cur:-2, step:0, last:0, tone:-1, ks:new Map() };
const SCALE = THEME.scale, NS = SCALE.length;
const hz = (deg, oct=0, base=THEME.base) => 440*Math.pow(2, (base + 12*(oct + Math.floor(deg/NS)) + SCALE[mod(deg,NS)] - 69)/12);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const A = () => SND.ac;
const sndReady = () => SND.on && SND.ac?.state==="running";

function sndInit(){
  const ac = SND.ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 8;   // 总线限幅，防爆音
  SND.out = ac.createGain(); SND.out.gain.value = 0; SND.out.connect(comp).connect(ac.destination);
  // 混响：一段指数衰减的噪声当冲激响应
  const len = ac.sampleRate*2.8, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c=0; c<2; c++){ const b = ir.getChannelData(c); for (let i=0; i<len; i++) b[i] = (Math.random()*2-1)*Math.pow(1-i/len, 3.2); }
  const verb = ac.createConvolver(); verb.buffer = ir; verb.connect(SND.out);
  SND.wet = ac.createGain(); SND.wet.gain.value = .32; SND.wet.connect(verb);
  // fx 总线：悬停音、转场；lp 总线：章节环境声，横向滚动时改它的亮度
  SND.fx = ac.createGain(); SND.fx.connect(SND.out); SND.fx.connect(SND.wet);
  const hl = ac.createBiquadFilter(); hl.type = "lowpass"; hl.frequency.value = 3200; hl.Q.value = .5;   // 悬停音再过一道柔和低通，去掉刺耳的高频
  SND.hov = ac.createGain(); SND.hov.connect(hl).connect(SND.fx);
  SND.lp = ac.createBiquadFilter(); SND.lp.type = "lowpass"; SND.lp.frequency.value = 2400; SND.lp.Q.value = .5;
  SND.lp.connect(SND.out); SND.lp.connect(SND.wet);
  SND.noise = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
  SND.crackle = ac.createBuffer(1, ac.sampleRate*3, ac.sampleRate);
  const nz = SND.noise.getChannelData(0), cr = SND.crackle.getChannelData(0);
  for (let i=0; i<nz.length; i++) nz[i] = Math.random()*2-1;
  for (let i=0; i<cr.length; i++) cr[i] = Math.random() < .0007 ? (Math.random()*2-1)*.8 : (Math.random()*2-1)*.004;
  setInterval(sndTick, 60);
}
function env(g, t, a, peak, dec){ g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t+a); g.gain.exponentialRampToValueAtTime(.0001, t+a+dec); }
const V = {
  bell(f, t, dest, v=.16, soft=false){         // 钟：FM 合成。soft：调制深度封顶，泛音少、起音软
    const ac = A(), c = ac.createOscillator(), m = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
    const idx = soft ? Math.min(f*2.4, 520) : f*2.4;
    c.frequency.value = f; m.frequency.value = f*3.51;
    mg.gain.setValueAtTime(idx, t); mg.gain.exponentialRampToValueAtTime(Math.max(1, idx/60), t+2.6);
    m.connect(mg).connect(c.frequency); c.connect(g).connect(dest); env(g, t, soft ? .01 : .004, v, 3.4);
    c.start(t); m.start(t); c.stop(t+3.6); m.stop(t+3.6);
  },
  pluck(f, t, dest, v=.3, soft=false){         // 拨弦：Karplus-Strong，每个音高的波形算一次就缓存。soft：起音的噪声先磨圆
    const ac = A(), key = Math.round(f) + (soft ? "s" : ""); let buf = SND.ks.get(key);
    if (!buf){
      const sr = ac.sampleRate, n = Math.floor(sr*2.4), p = Math.max(2, Math.round(sr/f));
      buf = ac.createBuffer(1, n, sr); const x = buf.getChannelData(0);
      for (let i=0; i<p; i++) x[i] = Math.random()*2-1;
      if (soft) for (let k=0; k<3; k++) for (let i=1; i<p; i++) x[i] = (x[i] + x[i-1])*.5;
      for (let i=p; i<n; i++) x[i] = (x[i-p] + x[i-p+1])*.4985;
      SND.ks.set(key, buf);
    }
    const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; g.gain.value = v; s.connect(g).connect(dest); s.start(t);
  },
  synth(f, t, dest, v=.07, dur=.2, soft=false){   // synth：两个略走音的锯齿波 + 共振低通往下扫。soft：共振和起扫频率都压低
    const ac = A(), fl = ac.createBiquadFilter(), g = ac.createGain();
    fl.type = "lowpass"; fl.Q.value = soft ? 3 : 7; fl.frequency.setValueAtTime(Math.min(soft ? 2800 : 12000, f*9), t); fl.frequency.exponentialRampToValueAtTime(f*1.2, t+dur);
    fl.connect(g).connect(dest); env(g, t, soft ? .01 : .004, v, dur);
    [0,7].forEach(dt=>{ const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = dt; o.connect(fl); o.start(t); o.stop(t+dur+.05); });
  },
  keys(f, t, dest, v=.07, dur=1.8){            // lo-fi 电钢：正弦加两个泛音
    const ac = A(), g = ac.createGain(); g.connect(dest); env(g, t, .008, v, dur);
    [[1,1],[2,.22],[3,.06]].forEach(([k,a])=>{ const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = f*k; og.gain.value = a; o.connect(og).connect(g); o.start(t); o.stop(t+dur+.1); });
  },
  wood(f, t, dest, v=.16){                     // 木琴般的短音
    const ac = A(), o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = f;
    o.connect(g).connect(dest); env(g, t, .002, v, .45); o.start(t); o.stop(t+.5);
  },
  chirp(t, dest, v=.035){                      // 鸟鸣
    const ac = A(), o = ac.createOscillator(), g = ac.createGain(), f0 = rnd(2600, 4200);
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0*1.45, t+.05); o.frequency.exponentialRampToValueAtTime(f0*.85, t+.11);
    o.connect(g).connect(dest); env(g, t, .008, v, .11); o.start(t); o.stop(t+.15);
  },
  swoosh(t, dest, v=.12, dur=.55){             // 转场的一阵风
    const ac = A(), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = SND.noise; fl.type = "bandpass"; fl.Q.value = 1.2;
    fl.frequency.setValueAtTime(300, t); fl.frequency.exponentialRampToValueAtTime(3200, t+dur*.6); fl.frequency.exponentialRampToValueAtTime(600, t+dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+dur*.45); g.gain.linearRampToValueAtTime(0, t+dur);
    s.connect(fl).connect(g).connect(dest); s.start(t); s.stop(t+dur+.05);
  },
};
function loopNoise(dest, buf, type, freq, q, gain){
  const ac = A(), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = buf; s.loop = true; fl.type = type; fl.frequency.value = freq; fl.Q.value = q; g.gain.value = gain;
  s.connect(fl).connect(g).connect(dest); s.start(); return { s, fl, g };
}
function lfo(param, rate, depth){ const ac = A(), o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = rate; g.gain.value = depth; o.connect(g).connect(param); o.start(); return o; }
function drone(dest, f, type, gain){ const ac = A(), o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.value = gain; o.connect(g).connect(dest); o.start(); return o; }

Object.assign(V, {
  wind(t, dest, v=.08, dur=1, f0=300, f1=2400, q=1.2, type="bandpass"){
    const ac = A(), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = SND.noise; s.loop = true; fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t+dur*.55); fl.frequency.exponentialRampToValueAtTime(f0, t+dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+dur*.45); g.gain.linearRampToValueAtTime(0, t+dur);
    s.connect(fl).connect(g).connect(dest); s.start(t, Math.random()); s.stop(t+dur+.05);
  },
  riser(t, dest, v=.04, dur=.8, f0=200, f1=4000, root=146.8){   // 三个锯齿波叠成和弦，共振低通从 f0 扫到 f1
    const ac = A(), fl = ac.createBiquadFilter(), g = ac.createGain();
    fl.type = "lowpass"; fl.Q.value = 9; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+dur*.85); g.gain.linearRampToValueAtTime(0, t+dur+.06);
    fl.connect(g).connect(dest);
    [[1,0],[1,9],[1.5,-6],[.5,4]].forEach(([k,dt])=>{ const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = root*k; o.detune.value = dt; o.connect(fl); o.start(t); o.stop(t+dur+.1); });
  },
  vinyl(t, dest, v=.6, dur=1){
    const ac = A(), s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = SND.crackle; s.loop = true; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.08); g.gain.linearRampToValueAtTime(0, t+dur);
    s.connect(g).connect(dest); s.start(t, Math.random()*2); s.stop(t+dur+.05);
  },
});
const arp = (t, degs, gap, fn) => degs.forEach((d,k)=>fn(d, t + k*gap));

/* ===== 声音：风格区 ===== one set of instruments and ambience per chapter, in CHAPTERS order. Recipes: skills/photo-album/references/sound.md

// Instruments this album needs that the engine lacks: the Holy Hill organ, the steamboat calliope, the lake's loon and gulls,
// the polka tuba of the Dairy State, and a harmonica for the drive home
Object.assign(V, {
  organ(f, t, dest, v=.03, dur=1.6){           // pipe organ: drawbar sines (sub, unison, octave, twelfth, fifteenth), slow speech, no decay while held
    const ac = A(), g = ac.createGain(), hold = Math.max(t+.1, t+dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.09); g.gain.setValueAtTime(v, hold); g.gain.linearRampToValueAtTime(0, hold+.35);
    g.connect(dest);
    [[.5,.3],[1,1],[2,.5],[3,.18],[4,.16]].forEach(([k,a])=>{ const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = f*k; og.gain.value = a;
      o.connect(og).connect(g); o.start(t); o.stop(hold+.4); });
  },
  calliope(f, t, dest, v=.04, dur=.4){          // steam calliope: a breathy pipe that wobbles in pitch, as the steam pressure does
    const ac = A(), g = ac.createGain(), hold = Math.max(t+.04, t+dur-.06), o = ac.createOscillator(), o2 = ac.createOscillator(), o2g = ac.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.025); g.gain.setValueAtTime(v, hold); g.gain.linearRampToValueAtTime(0, hold+.07);
    g.connect(dest);
    o.frequency.value = f; o2.type = "triangle"; o2.frequency.value = f*2; o2g.gain.value = .22;
    const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = rnd(5.6, 6.8); vg.gain.value = f*.011;
    vib.connect(vg); vg.connect(o.frequency); vg.connect(o2.frequency);
    const n = ac.createBufferSource(), nf = ac.createBiquadFilter(), ng = ac.createGain();   // the steam
    n.buffer = SND.noise; nf.type = "bandpass"; nf.frequency.value = Math.min(5000, f*2); nf.Q.value = 5; ng.gain.value = .35;
    o.connect(g); o2.connect(o2g).connect(g); n.connect(nf).connect(ng).connect(g);
    [o, o2, vib].forEach(x=>{ x.start(t); x.stop(hold+.1); }); n.start(t, Math.random()); n.stop(hold+.1);
  },
  loon(t, dest, v=.03){                        // common loon wail: a slow rise, a long held note with a slight waver, a falling end
    const ac = A(), o = ac.createOscillator(), o2 = ac.createOscillator(), o2g = ac.createGain(), g = ac.createGain(), f0 = rnd(470, 560);
    [o, o2].forEach((x,k)=>{ const m = k ? 2 : 1;
      x.frequency.setValueAtTime(f0*m, t); x.frequency.linearRampToValueAtTime(f0*1.5*m, t+.4); x.frequency.setValueAtTime(f0*1.5*m, t+1.25);
      x.frequency.linearRampToValueAtTime(f0*1.34*m, t+1.55); x.frequency.linearRampToValueAtTime(f0*1.12*m, t+1.95); });
    const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 4.6; vg.gain.value = f0*.012; vib.connect(vg).connect(o.frequency);
    o2g.gain.value = .12; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.22); g.gain.setValueAtTime(v, t+1.5); g.gain.linearRampToValueAtTime(0, t+2);
    o.connect(g); o2.connect(o2g).connect(g); g.connect(dest);
    [o, o2, vib].forEach(x=>{ x.start(t); x.stop(t+2.05); });
  },
  gull(t, dest, v=.016){                       // herring gull over the lakefront: a short nasal "kee-ow"
    const ac = A(), o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain(), f0 = rnd(1150, 1400);
    o.type = "sawtooth"; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f0*1.25, t+.06); o.frequency.exponentialRampToValueAtTime(f0*.7, t+.3);
    fl.type = "bandpass"; fl.frequency.value = 1700; fl.Q.value = 3;
    o.connect(fl).connect(g).connect(dest); env(g, t, .015, v, .3); o.start(t); o.stop(t+.36);
  },
  tuba(f, t, dest, v=.1, dur=.22){             // polka oom-pah: a round brass bass, sawtooth behind a low lowpass
    const ac = A(), o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain();
    o.type = "sawtooth"; o.frequency.value = f; fl.type = "lowpass"; fl.Q.value = .8;
    fl.frequency.setValueAtTime(f*2, t); fl.frequency.linearRampToValueAtTime(f*4.5, t+.03); fl.frequency.exponentialRampToValueAtTime(f*2.2, t+dur);
    o.connect(fl).connect(g).connect(dest); env(g, t, .018, v, dur); o.start(t); o.stop(t+dur+.05);
  },
  harmonica(f, t, dest, v=.03, dur=.6){        // harmonica: two reeds, a little bend up into the note, a breathy band
    const ac = A(), bp = ac.createBiquadFilter(), lp = ac.createBiquadFilter(), g = ac.createGain(), hold = Math.max(t+.06, t+dur-.1);
    bp.type = "bandpass"; bp.frequency.value = Math.min(3200, f*3); bp.Q.value = .8; lp.type = "lowpass"; lp.frequency.value = 2600;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.06); g.gain.setValueAtTime(v*.85, hold); g.gain.linearRampToValueAtTime(0, hold+.12);
    bp.connect(lp).connect(g).connect(dest);
    const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 5; vg.gain.value = f*.006; vib.connect(vg);
    [["square",0],["sawtooth",7]].forEach(([type,dt])=>{ const o = ac.createOscillator(); o.type = type; o.detune.value = dt;
      o.frequency.setValueAtTime(f*.965, t); o.frequency.exponentialRampToValueAtTime(f, t+.09); vg.connect(o.frequency);
      o.connect(bp); o.start(t); o.stop(hold+.15); });
    vib.start(t); vib.stop(hold+.15);
  },
});
